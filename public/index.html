<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>steno-lessons</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">steno<span>-lessons</span></div>
    <label class="toggle"><input type="checkbox" id="hints" checked> Key hints</label>
    <div class="stats" id="stats"></div>
  </header>

  <main>
    <p class="error" id="error" hidden></p>

    <section class="card" id="practice" aria-live="polite">
      <div class="stream" id="stream"></div>
      <div class="feedback" id="feedback">Hold the keys for each stroke all at once, then release. No steno mode needed.</div>
      <div class="window-note" id="window-note"></div>
    </section>

    <section class="keyboard-wrap">
      <div class="keyboard" id="keyboard" aria-label="QWERTY keyboard"></div>
      <p class="legend">
        <span class="swatch steno"></span> steno key
        <span class="swatch locked"></span> locked
        <span class="swatch target"></span> target
        <span class="swatch down"></span> held
      </p>
    </section>

    <section class="card keys-panel">
      <h2>Keys</h2>
      <p class="hint">A key unlocks when your speed and accuracy reach the goal. Layout from <code>keymux steno layout</code>.</p>
      <ul class="key-list" id="key-list"></ul>
    </section>
  </main>

  <script src="/lib/steno.js"></script>
  <script src="/lib/lessons.js"></script>
  <script src="/app.js"></script>
</body>
</html>
