<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>steno-lessons</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hud" id="hud">
    <div class="hud-row hud-metrics" id="metrics-row">
      <span class="brand">steno<span>-lessons</span></span>
      <span class="metrics" id="metrics"></span>
      <span class="lesson-note" id="lesson-note"></span>
      <label class="toggle"><input type="checkbox" id="hints" checked> Key hints</label>
    </div>
    <ul class="hud-row key-chips" id="key-chips"></ul>
    <div class="hud-row hud-line"><span class="hud-label">Current key:</span> <span id="current-key"></span></div>
    <div class="hud-row hud-line"><span class="hud-label">Accuracy:</span> <span id="accuracy-streak"></span></div>
  </header>

  <main>
    <p class="error" id="error" hidden></p>

    <section class="card" id="practice" aria-live="polite">
      <div class="stream" id="stream"></div>
      <div class="feedback" id="feedback">Hold the keys for each stroke all at once, then release. No steno mode needed.</div>
      <div id="pause-overlay" class="hidden">
        <p>Paused &mdash; press any key to resume</p>
      </div>
    </section>

    <section class="keyboard-wrap">
      <div class="keyboard" id="keyboard" aria-label="QWERTY keyboard"></div>
      <p class="legend">
        <span class="swatch steno"></span> steno key
        <span class="swatch locked"></span> locked
        <span class="swatch target"></span> target
        <span class="swatch down"></span> held
      </p>
    </section>
  </main>

  <script src="/lib/steno.js"></script>
  <script src="/lib/word-frequency.js"></script>
  <script src="/lib/lessons.js"></script>
  <script src="/app.js"></script>
</body>
</html>
